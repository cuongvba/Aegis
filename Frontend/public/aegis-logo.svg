<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="core-spark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F1F5F9" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <radialGradient id="mark-glow" cx="50" cy="40" r="40">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090D1A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="44" cy="40" r="36" fill="url(#mark-glow)" />

  <!-- Shield Mark -->
  <g transform="translate(6, 2) scale(0.76)">
    <!-- Outer Shield Rim -->
    <path
      d="M 50 6 L 88 22 C 88 54 74 78 50 94 C 26 78 12 54 12 22 Z"
      fill="#090D1A"
      stroke="url(#shield-grad)"
      stroke-width="3.5"
      stroke-linejoin="round"
    />
    <!-- Inner Mantle -->
    <path
      d="M 50 13 L 81 27 C 81 52 69 73 50 86 C 31 73 19 52 19 27 Z"
      fill="#0F172A"
      fill-opacity="0.9"
      stroke="url(#shield-grad)"
      stroke-width="1.2"
      stroke-opacity="0.6"
    />
    <!-- Left Facet Shade -->
    <path
      d="M 50 13 L 19 27 C 19 52 31 73 50 86 Z"
      fill="#0284C7"
      fill-opacity="0.15"
    />
    <!-- Ascending Alpha Chevron -->
    <path
      d="M 50 24 L 72 64 L 61 64 L 50 42 L 39 64 L 28 64 Z"
      fill="url(#shield-grad)"
    />
    <!-- Quantum Prism -->
    <path
      d="M 50 34 L 60 49 L 50 64 L 40 49 Z"
      fill="url(#core-spark)"
    />
    <circle cx="50" cy="49" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typographic Wordmark -->
  <g transform="translate(86, 0)">
    <!-- Primary Name -->
    <text
      x="0"
      y="42"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="28"
      font-weight="900"
      letter-spacing="1.5"
      fill="url(#text-grad)"
    >
      AEGIS
      <tspan fill="url(#sub-grad)" font-weight="900" dx="6">GLOBAL</tspan>
    </text>

    <!-- Subtitle / Positioning Tagline -->
    <text
      x="1"
      y="58"
      font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-size="8"
      font-weight="700"
      letter-spacing="2"
      text-transform="uppercase"
      fill="#64748B"
    >
      COGNITIVE INFRASTRUCTURE &amp; VERIFICATION
    </text>
  </g>
</svg>

